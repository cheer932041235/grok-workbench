name: 功能建议
description: 描述使用场景和希望改善的体验
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 你在什么场景遇到了困难？
      description: 描述目前的操作过程和不便。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望得到什么体验？
      description: 可以附示意图或具体例子，不需要先给出技术方案。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 补充信息
      description: 尝试过的替代方式，或你愿意参与的部分。
